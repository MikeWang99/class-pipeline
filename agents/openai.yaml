  short_description: "物理课前备课、限时可靠录音转写与证据驱动课后反馈"
  default_prompt: "Use $class-pipeline v2.4 for every Class Pipeline task. Run healthcheck first; if the installed config/native capture binary is stale, run setup.sh --repair before relying on recording. Classroom recording has a hard 150-minute maximum, disk-space guards, runtime heartbeat/frame monitoring, same-session segmented recovery, and an incomplete-recording hard gate. Never generate formal feedback or update a student profile from a session marked recording_incomplete."

